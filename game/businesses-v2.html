<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markets &amp; Makers · Business Buildings V2</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: #073f43; }
      body { overflow: hidden; }
      #catalog { position: fixed; inset: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #chrome { position: absolute; inset: 0; display: grid; grid-template-rows: 92px 1fr; pointer-events: none; }
      header { padding: 18px 24px 10px; background: linear-gradient(180deg, rgba(3,42,45,.98), rgba(3,42,45,.76), transparent); }
      .eyebrow { color: #8fd5c2; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 3px 0 0; color: #fff3ce; font-family: Georgia, serif; font-size: clamp(24px, 2.1vw, 38px); line-height: 1; }
      .sub { margin-left: 12px; color: #d3bc7a; font-family: Inter, sans-serif; font-size: 13px; font-weight: 700; }
      #labels { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); padding: 2px 10px 10px; gap: 8px; }
      .card { position: relative; border: 1px solid rgba(255,243,206,.28); border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(1,34,36,.55), 0 9px 26px rgba(0,0,0,.18); overflow: hidden; }
      .label { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; align-items: end; justify-content: space-between; gap: 8px; }
      .identity { max-width: 70%; padding: 7px 10px 8px; border-radius: 10px; background: rgba(3,42,45,.88); border: 1px solid rgba(143,213,194,.32); backdrop-filter: blur(5px); }
      .index { color: #e0b040; font-size: 10px; font-weight: 900; letter-spacing: .12em; }
      .name { margin-top: 2px; color: #fff3ce; font-family: Georgia, serif; font-size: clamp(12px, 1vw, 17px); font-weight: 800; line-height: 1.05; }
      .cue { margin-top: 3px; color: #a8d9cd; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .stats { padding: 5px 7px; border-radius: 8px; color: #f3d98e; background: rgba(46,78,72,.88); font-size: 8px; font-weight: 800; line-height: 1.35; text-align: right; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main id="catalog"><canvas id="view"></canvas><div id="chrome"><header><div class="eyebrow">Mercedonia asset forge · mobile-lite production geometry</div><h1>15 Solarpunk Business Buildings <span class="sub">unique silhouettes · one draw call each · +Z customer front</span></h1></header><section id="labels"></section></div></main>
    <script type="module" src="/src/businessCatalog.ts"></script>
  </body>
</html>
