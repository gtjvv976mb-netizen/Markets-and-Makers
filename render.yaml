services:
  - type: web
    name: markets-and-makers-authority
    runtime: node
    rootDir: server
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    # Deploy on the push itself, not on GitHub checks reporting green.
    #
    # checksPass waits for a check run to arrive and says nothing when none ever does. On
    # 2026-08-27 three commits sat undeployed behind it while the live economy served a
    # build with a known money-losing bug, and every repo-side cause was ruled out: both
    # `npm ci` commands pass, the CI jobs pass with the exact commands the workflow runs,
    # the build emits dist/index.js and dist/migrate.js, and the push was confirmed on
    # refs/heads/main. A gate that blocks everything and reports nothing is not a gate.
    #
    # What is lost is the test suite gating the deploy. What is NOT lost: Render's own
    # build runs `npm ci && npm run build`, which type-checks, and a build that fails
    # leaves the previous version serving. Tests still gate the push via CI.
    #
    # NOTE: this line only governs anything if the service is Blueprint-managed. For a
    # service created by hand, the dashboard's Auto-Deploy setting wins and this is
    # decorative — check there if a push still does not deploy.
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGINS
        value: https://www.markets-makers.com,https://markets-makers.com,https://markets-and-makers-game.gtjvv976mb.workers.dev
      - key: DATABASE_URL
        fromDatabase:
          name: markets-and-makers-db
          property: connectionString
      # The live $MM mint is on mainnet. Pairing it with devnet now fails loudly
      # rather than reading as a zero balance, so the two must move together.
      - key: SOLANA_NETWORK
        value: mainnet
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_WEBHOOK_SECRET
        generateValue: true
      # Public mint address, safe in the blueprint; the Helius key is not.
      - key: MM_TOKEN_MINT
        value: 3mEpcPcmKmHbRUUEhZfutTUsQNaJv3ibao6cyZPDpump
      # The world tick: the authority produces goods, sells them to Mercedonians and pays
      # civic wages on its own schedule, whether or not anyone is playing. Off by default
      # in code because it is the one loop that moves money without a player asking it to;
      # switching it on here is the deliberate act.
      #
      # 60s is a scheduling choice, not an economic one — the tick accrues the time it
      # cannot yet use, so a shorter interval settles the same trade in smaller pieces.
      - key: MM_WORLD_TICK
        value: 1
      - key: MM_WORLD_TICK_SECONDS
        value: 60
      # --- On-chain payouts: OFF. Going live is a deliberate, three-part dashboard act:
      #   1. set PAYOUT_TREASURY_SECRET in the dashboard (never in this file, never in git)
      #   2. MM_PAYOUTS=1
      #   3. MM_PAYOUTS_MAINNET=1   (payouts refuse mainnet without this second flag)
      # Fund the treasury wallet with $MM AND enough SOL for fees first. Rehearse on
      # devnet with server/scripts/payout-rehearsal.ts before ever flipping these.
      - key: MM_PAYOUTS
        value: 0
      - key: MM_PAYOUTS_MAINNET
        value: 0
      # --- Declared here so they SURVIVE. Both are dashboard-provided (sync: false keeps
      # the value out of git); the point of naming them is that a blueprint re-apply, a
      # environment rebuild or a new region does not silently come up without them.
      #
      # MM_ADMIN_KEY gates every operator route. Unset means those routes are CLOSED, not
      # open — but it also means the kill switch is unavailable in the incident where it
      # is wanted, which is the whole reason it must not go missing by accident.
      - key: MM_ADMIN_KEY
        sync: false
      # The cabinet is an LLM: without this key the government still runs on its standing
      # formula, but it stops REASONING about the treasury — no directives, no addresses,
      # and the wage and works dials sit wherever they were last smoothed to.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: markets-and-makers-db
    region: singapore
    plan: basic-256mb
    databaseName: markets_makers
    user: markets_makers
    ipAllowList: []
    storageAutoscalingEnabled: true
